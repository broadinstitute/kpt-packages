apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: gcp-cloud-build-deploy
    backstage.io/kubernetes-id: backstage-component-id
spec:
  selector:
    matchLabels:
      app: grafana
  endpoints:
    - port: 3000
      interval: 1m
